<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umesh AI Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
    </style>
  </head>

  <body
    class="h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"
  >
    <!-- Chat Button -->
    <button
      id="chatButton"
      class="fixed bottom-5 right-5 md:bottom-6 md:right-6 z-50 w-14 h-14 md:w-16 md:h-16 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all"
    >
      <i data-lucide="message-circle" class="w-6 h-6 text-white"></i>
    </button>

    <!-- Backdrop -->
    <div id="backdrop" class="hidden fixed inset-0 bg-black/30 z-40"></div>

    <!-- Chat Window -->
    <div
      id="chatWindow"
      class="hidden fixed z-50 bottom-0 right-0 w-full h-[85vh] sm:bottom-6 sm:right-6 sm:w-[400px] sm:h-[650px] bg-slate-900/95 backdrop-blur-xl border border-white/10 rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden"
    >
      <!-- Header -->
      <div class="px-5 py-4 border-b border-white/10 flex items-center gap-3">
        <div
          class="w-11 h-11 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 flex items-center justify-center text-white"
        >
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>

        <div>
          <h2 class="text-white font-semibold">AI Assistant</h2>
          <p class="text-green-400 text-xs">● Online</p>
        </div>
      </div>

      <!-- Messages -->
      <div
        id="messages"
        class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar"
      ></div>

      <!-- Input -->
      <div class="p-4 border-t border-white/10 bg-black/20">
        <div class="flex gap-2 bg-white rounded-2xl p-2">
          <textarea
            id="question"
            rows="1"
            class="flex-1 px-3 py-2 outline-none bg-transparent resize-none max-h-32 overflow-y-auto"
            placeholder="Type your message..."
          ></textarea>

          <button
            id="send"
            class="bg-cyan-500 hover:bg-cyan-600 text-white px-4 py-2 rounded-xl flex items-center justify-center"
          >
            <i data-lucide="send" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </div>

    <script>
      let isOpen = false;

      function time() {
        return new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      /* -------------------- MEMORY (SESSION STORAGE) -------------------- */
      let messages = JSON.parse(sessionStorage.getItem("chat_messages")) || [
        {
          role: "bot",
          text: `Welcome to Umesh Khanal's AI Assistant.

Ask me anything about his background, technical expertise, projects, work experience, achievements, or professional journey.

How can I assist you today?`,
          time: time(),
        },
      ];

      function saveMessages() {
        sessionStorage.setItem("chat_messages", JSON.stringify(messages));
      }

      /* -------------------- ELEMENTS -------------------- */
      const chatBtn = document.getElementById("chatButton");
      const chatWindow = document.getElementById("chatWindow");
      const backdrop = document.getElementById("backdrop");
      const container = document.getElementById("messages");
      const input = document.getElementById("question");

      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = input.scrollHeight + "px";
      });

      /* -------------------- OPEN / CLOSE -------------------- */
      chatBtn.onclick = () => {
        chatWindow.classList.remove("hidden");
        backdrop.classList.remove("hidden");
        render();
      };

      backdrop.onclick = () => {
        chatWindow.classList.add("hidden");
        backdrop.classList.add("hidden");
      };

      /* -------------------- SEND -------------------- */
      document.getElementById("send").onclick = send;

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") send();
      });

      async function send() {
        const q = input.value.trim();
        if (!q) return;

        messages.push({ role: "user", text: q, time: time() });
        saveMessages();
        input.value = "";
        render();

        try {
          const res = await fetch("http://localhost:8000/response", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q }),
          });

          const data = await res.json();

          messages.push({
            role: "bot",
            text: data.response,
            time: time(),
          });
        } catch (e) {
          messages.push({
            role: "bot",
            text: "Server not reachable",
            time: time(),
          });
        }
        input.style.height = "auto";
        saveMessages();
        render();
      }

      /* -------------------- RENDER -------------------- */
      function render() {
        container.innerHTML = "";

        messages.forEach((m) => {
          const div = document.createElement("div");
          div.className = `flex ${m.role === "user" ? "justify-end" : "justify-start"}`;

          div.innerHTML = `
      <div class="${
        m.role === "user" ? "bg-cyan-500 text-white" : "bg-white/20 text-white"
      } max-w-[80%] px-4 py-3 rounded-2xl">
        <p>${m.text.replace(/\n/g, "<br>")}</p>
        <p class="text-[10px] opacity-70 text-right mt-1">${m.time}</p>
      </div>
    `;

          container.appendChild(div);
        });

        container.scrollTop = container.scrollHeight;

        // re-init icons
        lucide.createIcons();
      }

      /* -------------------- INIT -------------------- */
      render();
      lucide.createIcons();
    </script>
  </body>
</html>
